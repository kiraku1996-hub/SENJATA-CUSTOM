name: Build AnimeWeapons

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: AnimeWeapons/pom.xml
      - name: Build jar
        working-directory: AnimeWeapons
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeWeapons-jar
          path: AnimeWeapons/target/AnimeWeapons.jar
          
