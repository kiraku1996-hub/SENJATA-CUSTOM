# Cooldown dalam detik, damage dalam HP (2 HP = 1 hati)
weapons:
  dismantle:
    cooldown: 6.0
    damage: 12.0
  hollow_purple:
    cooldown: 25.0
    damage: 20.0
    # Jika true, ledakan akhir menghapus blok (tetap memicu BlockBreakEvent
    # sehingga plugin proteksi seperti WorldGuard bisa membatalkan).
    break-blocks: false
    break-radius: 4
  inverted_spear:
    cooldown: 8.0
    damage: 8.0
    true-damage: 4.0
  sun_breathing:
    cooldown: 10.0
    damage: 7.0
  getsuga:
    cooldown: 7.0
    damage: 14.0
